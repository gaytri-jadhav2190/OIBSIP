<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempora | Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <main class="container">

        <section class="converter-card">

            <div class="icon">🌡️</div>

            <h1>Temperature Converter</h1>

            <p class="subtitle">
                Convert temperatures quickly and accurately
            </p>

            <div class="form-group">
                <label for="temperature">Enter Temperature</label>

                <div class="input-wrapper">
                    <input
                        type="number"
                        id="temperature"
                        placeholder="e.g. 25"
                        step="any"
                    >
                    <span>°</span>
                </div>
            </div>

            <div class="form-group">
                <label for="unit">Convert From</label>

                <select id="unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <button onclick="convertTemperature()">
                Convert Temperature
                <span>→</span>
            </button>

            <div id="result" class="result">
                <div class="result-icon">✨</div>
                <p>Your converted temperature will appear here.</p>
            </div>

            <div class="info">
                <span>✓</span>
                Supports °C, °F and K
            </div>

        </section>

    </main>

    <footer>
        <p>Temperature Converter • Web Development & Designing</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
